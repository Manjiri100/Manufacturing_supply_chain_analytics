name: project-quality
on:
  push:
  pull_request:
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Compile generator
        run: python -m py_compile scripts/generate_data.py
      - name: Check SQL files
        run: python - <<'PY'
from pathlib import Path
files=list(Path('sql').glob('*.sql'))
assert len(files)==7
assert all(f.stat().st_size>500 for f in files)
print(f'Validated {len(files)} SQL files')
PY
